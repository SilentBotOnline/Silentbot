name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    # Install Miniconda so conda commands and $CONDA are available
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: 3.10
        auto-activate-base: false

    - name: Add conda to system path
      run: echo "${{ env.CONDA }}"/bin >> $GITHUB_PATH
      env:
        CONDA: ${{ env.CONDA }}   # setup-miniconda sets CONDA

    - name: Install dependencies
      run: |
        if [ -f environment.yml ]; then
          conda env update --file environment.yml --name base
        else
          echo "environment.yml not found — creating minimal base env"
          conda create -y --name base python=3.10 flake8 pytest
        fi
        # activate the base environment for following steps
        conda activate base
      shell: bash -lc

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      shell: bash -lc

    - name: Test with pytest
      run: |
        pytest
      shell: bash -lc
